<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Glowing Accent Border Inner -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.4" />

  <!-- Monogram PB -->
  <g filter="url(#glow)">
    <text x="32" y="42" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" 
          font-size="28" 
          font-weight="800" 
          fill="url(#accent)" 
          text-anchor="middle"
          letter-spacing="-1">PB</text>
  </g>
</svg>
