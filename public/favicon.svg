<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Monogram Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Monogram Secondary Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Gold Sparkle Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Geometric Monogram "PB" -->
  <g filter="url(#softGlow)">
    <!-- Main Vertical Stem of P & B -->
    <rect x="148" y="128" width="44" height="256" rx="22" fill="url(#primaryGrad)" />

    <!-- Top Loop (P & upper B) -->
    <!-- Outer upper loop -->
    <path d="M 180 128 
             H 290 
             C 345 128, 380 160, 380 206 
             C 380 252, 345 284, 290 284 
             H 180 
             Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="40" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Lower Loop (B) -->
    <!-- Outer lower loop flowing from waist -->
    <path d="M 180 256 
             H 305 
             C 365 256, 404 292, 404 342 
             C 404 392, 365 428, 305 428 
             H 180 
             Z" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="40" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Literary Quill / Code Angle Accent Line inside lower loop -->
    <path d="M 275 342 L 325 342" 
          stroke="#ffffff" 
          stroke-width="14" 
          stroke-linecap="round" 
          opacity="0.9" />

    <!-- Inspiration Spark (Gold 4-point star) -->
    <g transform="translate(390, 138) scale(1.1)">
      <path d="M 0 -22 
               C 2 -8, 8 -2, 22 0 
               C 8 2, 2 8, 0 22 
               C -2 8, -8 2, -22 0 
               C -8 -2, -2 -8, 0 -22 Z" 
            fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </g>
</svg>
